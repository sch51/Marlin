name: Build Marlin
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Firmware
        run: pio run -e STM32F103RE_creality_maple
      - name: Commit auto-fixed configs
        if: failure()
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add Marlin/Configuration.h Marlin/Configuration_adv.h
          git commit -m "Auto-fix configuration files by Marlin" || echo "No changes"
          git push
      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/STM32F103RE_creality_maple/firmware-*.bin

name: Build Marlin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Auto-fix Marlin configs
        run: |
          python -c "
          import re
          for file in ['Marlin/Configuration.h', 'Marlin/Configuration_adv.h']:
              with open(file, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Force comment out boot screen
              content = re.sub(r'^\s*#define\s+SHOW_CUSTOM_BOOTSCREEN', '//#define SHOW_CUSTOM_BOOTSCREEN', content, flags=re.MULTILINE)
              
              # Force comment out status screen
              content = re.sub(r'^\s*#define\s+CUSTOM_STATUS_SCREEN_IMAGE', '//#define CUSTOM_STATUS_SCREEN_IMAGE', content, flags=re.MULTILINE)
              
              # Force disable EEPROM to break the boot loop
              content = re.sub(r'^\s*#define\s+EEPROM_SETTINGS', '//#define EEPROM_SETTINGS', content, flags=re.MULTILINE)
              
              # Fix old macros
              content = content.replace('EITHER(', 'ANY(')
              content = content.replace('BOTH(', 'ALL(')
              
              with open(file, 'w', encoding='utf-8') as f:
                  f.write(content)
          "
          
      - name: Install PlatformIO
        run: pip install platformio
        
      - name: Build Firmware
        run: pio run -e GD32F303RE_creality_mfl
        
      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/GD32F303RE_creality_mfl/firmware-*.bin

name: Build Marlin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Auto-fix Marlin configs (Python)
        run: |
          python -c "
          import re
          file = 'Marlin/Configuration.h'
          with open(file, 'r', encoding='utf-8') as f:
              content = f.read()
          # Force disable EEPROM to break the boot loop
          content = re.sub(r'^\s*#define\s+EEPROM_SETTINGS', '//#define EEPROM_SETTINGS', content, flags=re.MULTILINE)
          # Comment out bootscreen just in case
          content = re.sub(r'^\s*#define\s+SHOW_CUSTOM_BOOTSCREEN', '//#define SHOW_CUSTOM_BOOTSCREEN', content, flags=re.MULTILINE)
          with open(file, 'w', encoding='utf-8') as f:
              f.write(content)
              
          file_adv = 'Marlin/Configuration_adv.h'
          with open(file_adv, 'r', encoding='utf-8') as f:
              content_adv = f.read()
          content_adv = re.sub(r'^\s*#define\s+CUSTOM_STATUS_SCREEN_IMAGE', '//#define CUSTOM_STATUS_SCREEN_IMAGE', content_adv, flags=re.MULTILINE)
          with open(file_adv, 'w', encoding='utf-8') as f:
              f.write(content_adv)
          "
          
      - name: Install PlatformIO
        run: pip install platformio
        
      - name: Build Firmware
        run: pio run -e STM32F103RE_creality_maple
        
      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/STM32F103RE_creality_maple/firmware-*.bin

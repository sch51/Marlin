name: Build Marlin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
           - name: Auto-fix old Marlin macros
        run: |
          sed -i 's/EITHER(/ANY(/g' Marlin/Configuration.h Marlin/Configuration_adv.h
          sed -i 's/BOTH(/ALL(/g' Marlin/Configuration.h Marlin/Configuration_adv.h
          sed -i 's/#define \(.*\)_ENDSTOP_INVERTING false/#define \1_ENDSTOP_HIT_STATE HIGH/g' Marlin/Configuration.h
          sed -i 's/#define \(.*\)_ENDSTOP_INVERTING true/#define \1_ENDSTOP_HIT_STATE LOW/g' Marlin/Configuration.h
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Firmware
        run: pio run -e STM32F103RE_creality_maple
      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/STM32F103RE_creality_maple/firmware-*.bin
